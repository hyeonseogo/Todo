<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>회원가입</h1>
    <form id="signup-form">
      <input type="text" id="userid" placeholder="userid" required /><br />
      <input type="password" id="userpw" placeholder="userpw" required /><br />
      <input type="text" id="name" placeholder="name" required /><br />
      <input type="email" id="email" placeholder="email" required /><br />
      <button type="submit">회원가입</button>
    </form>

    <script>
      const form = document.getElementById("signup-form");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userid = document.getElementById("userid").value.trim();
        const userpw = document.getElementById("userpw").value.trim();
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!userid || !userpw || !name || !email) {
          alert("모든 항목을 입력하세요.");
          return;
        }

        try {
          const response = await fetch("/users/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ userid, userpw, name, email }),
          });

          const result = await response.json();

          if (response.ok) {
            alert("회원가입 성공");
            window.location.href = "login.html";
          } else {
            alert("회원가입 실패: " + result.message);
          }
        } catch (error) {
          alert("서버 연결 실패: " + error.message);
        }
      });
    </script>
  </body>
</html>
